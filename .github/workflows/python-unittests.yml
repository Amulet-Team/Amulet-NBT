# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unittests

on:
  push:
    branches:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

jobs:
  unittests:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
        os: [ macos-latest, windows-latest, ubuntu-latest ]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone Amulet-NBT.
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Set up Visual Studio
      if: ${{ matrix.os == 'windows-latest' }}
      shell: powershell
      run: |
        Invoke-WebRequest -Method Get -Uri https://download.visualstudio.microsoft.com/download/pr/f50ab15d-99d5-43aa-b0b4-496b6cb1e574/8e8630e8383f68b7d2110c409dc7b2df6ae3ac92254612952eeb6a1e40207105/vs_BuildTools.exe -OutFile vs_BuildTools.exe
        Start-Process -Wait vs_BuildTools.exe -ArgumentList '--installPath "C:\VS"', '--add', 'Microsoft.VisualStudio.Workload.VCTools', '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', '--quiet', '--norestart', '--wait'

    - name: Install Amulet NBT (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      shell: powershell
      run: |
        C:\VS\VC\Auxiliary\Build\vcvars64.bat
        pip install -v .[dev]
        python tools\compile_tests.py

    - name: Set up LLVM/Clang
      if: ${{ matrix.os == 'macos-latest' }}
      run: |
        curl -L https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.4/LLVM-20.1.4-macOS-ARM64.tar.xz -o llvm.tar.xz
        tar -xf llvm.tar.xz

    - name: Install Amulet NBT (MacOS)
      if: ${{ matrix.os == 'macos-latest' }}
      run: |
        export PATH="$PWD/llvm/bin:$PATH"
        export LDFLAGS="-L$PWD/llvm/lib"
        export CPPFLAGS="-I$PWD/llvm/include"
        clang --version
        for entry in $PWD/llvm/*
        do
          echo "$entry"
        done
        pip install -v .[dev]
        python tools/compile_tests.py

    - name: Install Amulet NBT (Linux)
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: |
        pip install -v .[dev]
        python tools/compile_tests.py

    - name: Test with unittest
      run: python -m unittest discover -v -s tests

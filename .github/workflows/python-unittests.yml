# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Unittests

on:
  push:
    branches:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

jobs:
  unittests:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
        os: [ macos-latest, windows-latest, ubuntu-latest ]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
    - name: Clone Amulet-NBT.
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Set up Visual Studio
      if: ${{ matrix.os == 'windows-latest' }}
      shell: powershell
      run: |
        Invoke-WebRequest -Method Get -Uri https://download.visualstudio.microsoft.com/download/pr/f50ab15d-99d5-43aa-b0b4-496b6cb1e574/e85a548c7acecb44083a86960fe08811757b1ef9dc869214e9ea17fbd46427b9/vs_Enterprise.exe -OutFile vs_enterprise.exe
        Start-Process -Wait vs_enterprise.exe -ArgumentList '--installPath "C:\VS"', '--add', 'Microsoft.VisualStudio.Workload.VCTools', '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', '--quiet', '--norestart', '--wait'

    - name: Install Amulet NBT (Windows)
      if: ${{ matrix.os == 'windows-latest' }}
      run: |
        cmd.exe /c '"C:\VS\VC\Auxiliary\Build\vcvars64.bat" && pip install -vv .[dev]'
        cmd.exe /c '"C:\VS\VC\Auxiliary\Build\vcvars64.bat" && python tools\compile_tests.py'

    - name: Install Amulet NBT (Linux/MacOS)
      if: ${{ matrix.os != 'windows-latest' }}
      run: |
        pip install -vv .[dev]
        python tools/compile_tests.py

    - name: Test with unittest
      run: python -m unittest discover -v -s tests
